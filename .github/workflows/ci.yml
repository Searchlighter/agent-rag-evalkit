name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    name: Python ${{ matrix.python-version }} quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests main.py
      - name: Lint
        run: python -m ruff check app scripts tests main.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build Python wheel
        if: matrix.python-version == '3.11'
        run: python -m pip wheel . --no-deps --wheel-dir dist

  adapter-contracts:
    name: Adapter contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Validate Adapter response contracts
        run: python -m unittest tests.test_adapter_contracts -v

  docker-build:
    name: Compose validation and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag agent-rag-evalkit:ci .
      - name: Verify non-root image user
        run: test "$(docker image inspect agent-rag-evalkit:ci --format '{{.Config.User}}')" = "evalkit"

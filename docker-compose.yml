name: agent-rag-evalkit-demo

x-service-defaults: &service-defaults
  image: agent-rag-evalkit-demo:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  cpus: 0.50
  mem_limit: 256m

services:
  mock-rag:
    <<: *service-defaults
    command:
      - uvicorn
      - app.mock_rag_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  evalkit-api:
    <<: *service-defaults
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      mock-rag:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
